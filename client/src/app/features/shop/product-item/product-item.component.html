@if (product) {
  <mat-card appearance="raised" class="h-full flex flex-col justify-between shadow-sm hover:shadow-md transition-shadow duration-200">
    <!-- Image du produit -->
    <img [src]="product.pictureUrl" [alt]="product.name" class="w-full h-48 object-cover rounded-t-lg" />

    <!-- Contenu de la carte -->
    <mat-card-content class="mt-3 flex-grow">
      <h2 class="text-sm font-semibold uppercase truncate">{{ product.name }}</h2>
      <!-- Affichage du prix formaté en devise -->
      <p class="font-light text-gray-600 mt-1">{{ product.price | currency:'number':'' }} €</p>
    </mat-card-content>

    <!-- Actions de la carte -->
    <mat-card-actions class="p-3 pt-0">
      <button mat-stroked-button class="w-full flex items-center justify-center gap-2">
        <mat-icon>add_shopping_cart</mat-icon>
        Add to Cart
      </button>
    </mat-card-actions>
  </mat-card>
}
