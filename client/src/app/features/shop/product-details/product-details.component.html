@if (product) {
  <section class="py-8">
    <div class="max-w-screen-2xl mx-auto px-4 sm:px-6">
      
      <!-- Grille à deux colonnes responsive -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
        
        <!-- Colonne de gauche : Image du produit -->
        <div class="max-w-xl mx-auto w-full">
          <img [src]="product.pictureUrl" [alt]="product.name" class="w-full h-auto object-cover rounded-lg shadow-md" />
        </div>

        <!-- Colonne de droite : Informations et actions -->
        <div class="flex flex-col justify-center">
          <h1 class="text-2xl md:text-3xl font-semibold text-gray-900">{{ product.name }}</h1>
          
          <div class="mt-4 flex items-center gap-4">
            <p class="text-3xl font-extrabold text-gray-900">
              {{ product.price | currency:'number':'' }} €
            </p>
          </div>

          <!-- Section d'ajout au panier et quantité -->
          <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-4 mt-6">
            
            <!-- Champ de saisie de quantité (Angular Material) -->
            <mat-form-field appearance="outline" class="w-full sm:w-36">
              <mat-label>Quantity</mat-label>
              <input matInput type="number" value="1" min="1" />
            </mat-form-field>

            <!-- Bouton d'ajout au panier -->
            <button mat-flat-button color="primary" class="mat-input-height flex items-center justify-center gap-2 px-6">
              <mat-icon>shopping_cart</mat-icon>
              Add to Cart
            </button>

          </div>

          <mat-divider class="my-6"></mat-divider>

          <!-- Description du produit -->
          <p class="text-gray-500 text-base leading-relaxed mt-6">
            {{ product.description }}
          </p>
        </div>

      </div>

    </div>
  </section>
}
