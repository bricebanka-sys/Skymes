
@if (products) {
  <div class="container  mx-auto px-4 sm:px-6 mt-6">

    <!-- En-tête de la boutique : empilé sur mobile, aligné en ligne de part et d'autre sur tablette/desktop -->
    <div class="flex flex-col lg:flex-row justify-between items-stretch lg:items-center mb-6 gap-4 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
      
      <!-- Composant Paginator d'Angular Material -->
      <mat-paginator
        class="bg-transparent w-full lg:w-auto"
        [length]="products.count"
        [pageSize]="shopParams.pageSize"
        [showFirstLastButtons]="true"
        [pageSizeOptions]="pageSizeOptions"
        [pageIndex]="shopParams.pageNumber - 1"
        (page)="handlePageEvent($event)"
        aria-label="Sélectionner la page">
      </mat-paginator>


      <!-- Formulaire de Recherche par Mot-Clé -->
      <form #searchForm="ngForm" (ngSubmit)="onSearchChange()" class="relative flex items-center w-full max-w-md mx-auto lg:mx-0">
        <input 
          type="search" 
          name="search"
          [(ngModel)]="shopParams.search"
          placeholder="Search..." 
          class="block w-full p-3 pr-10 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500"
        />
        <button type="submit" class="absolute right-2 p-2 text-gray-500 hover:text-gray-700 flex items-center justify-center">
          <mat-icon>search</mat-icon>
        </button>
      </form>
                
      <!-- Groupe de boutons (Filtres & Tri) -->
      <div class="flex flex-row items-center gap-3 w-full lg:w-auto">

        <!-- Bouton des filtres -->
        <button mat-flat-button color="primary" (click)="openFiltersDialog()" class="flex items-center  justify-center gap-2 flex-1 lg:flex-initial px-4 py-2">
          <mat-icon>filter_list</mat-icon>
          Filters
        </button>

        <!-- Bouton et Menu de Tri -->
        <button mat-flat-button color="primary" [matMenuTriggerFor]="sortMenu" class="flex items-center justify-center gap-2 flex-1 lg:flex-initial px-4 py-2">
          <mat-icon>swap_vert</mat-icon>
          Sort
        </button>

      </div>
    </div>

    <!-- Définition du menu de tri -->
    <mat-menu #sortMenu="matMenu" class="rounded-lg shadow-md">
      <mat-selection-list [multiple]="false" (selectionChange)="onSortChange($event)">
        @for (sort of sortOptions; track $index) {
          <mat-list-option [value]="sort.value" [selected]="shopParams.sort === sort.value">
            {{ sort.name }}
          </mat-list-option>
        }
      </mat-selection-list>
    </mat-menu>

    <!-- Grille des produits strictement responsive -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
      @for (product of products.data; track product.id) {
        <!-- Injection du composant enfant et liaison de propriété [product] -->
        <app-product-item [product]="product"></app-product-item>
      }
    </div>

  </div>
}
