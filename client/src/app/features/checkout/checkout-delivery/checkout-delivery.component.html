<mat-radio-group (change)="updateDeliveryMethod($event)" 
  class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
  @for (method of checkoutService.deliveryMethods(); track method.id) {
    <label
      class="p-3 sm:p-4 w-full h-full min-w-0 border border-gray-200! dark:border-gray-200! rounded-xl cursor-pointer hover:bg-[var(--mat-sys-primary)]/15 has-[:checked]:border-[var(--mat-sys-primary)]! transition flex items-start gap-2"
    >
      <mat-radio-button
        [value]="method"
        [checked]="cartService.cart()?.deliveryMethodId === method.id"
        class="mt-0.5 shrink-0 w-full min-w-0 [&_.mdc-form-field]:w-full [&_.mdc-form-field]:min-w-0 [&_.mdc-label]:min-w-0 [&_.mdc-label]:flex-1"
      >
        <div class="flex flex-col min-w-0 w-full">
          <strong class="font-semibold text-sm sm:text-base break-words">
            {{ method.shortName }} - {{ method.price | currency }}
          </strong>
          <span class="text-xs sm:text-sm text-gray-600 dark:text-gray-400 break-words">
            {{ method.description }}
          </span>
        </div>
      </mat-radio-button>
    </label>
  }
</mat-radio-group>
