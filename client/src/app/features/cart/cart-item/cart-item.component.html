<div class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">

  <!-- Image et Lien Produit -->
  <div class="flex items-center gap-3 sm:gap-4 w-full sm:w-auto min-w-0">
    <a [routerLink]="['/shop', item().productId]" class="shrink-0">
      <img
        [src]="item().pictureUrl"
        [alt]="item().productName"
        class="h-16 w-16 sm:h-20 sm:w-20 object-cover rounded-md"
      />
    </a>
    <div class="flex flex-col min-w-0">
      <a
        [routerLink]="['/shop', item().productId]"
        class="font-medium text-gray-800 hover:text-blue-600 transition-colors break-words"
      >
        {{ item().productName }}
      </a>
      <span class="text-xs sm:text-sm text-gray-500 truncate">
        {{ item().brand }} / {{ item().type }}
      </span>
    </div>
  </div>

  <!-- Contrôles de Quantité, Prix et Suppression -->
  <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto gap-3 sm:gap-4 md:gap-6 pt-3 sm:pt-0 border-t sm:border-t-0 border-gray-100 shrink-0">
    <div class="flex items-center gap-1 sm:gap-2">
      <!-- Bouton Décrémenter -->
      <button
        mat-icon-button
        type="button"
        class="text-red-600! hover:bg-red-50"
        (click)="decrementQuantity()"
        aria-label="Decrease quantity"
      >
        <mat-icon>remove</mat-icon>
      </button>

      <!-- Quantité -->
      <span class="font-semibold text-base sm:text-lg px-1.5 sm:px-2 tabular-nums">
        {{ item().quantity }}
      </span>

      <!-- Bouton Incrémenter -->
      <button
        mat-icon-button
        type="button"
        class="text-green-600! hover:bg-green-50"
        (click)="incrementQuantity()"
        aria-label="Increase quantity"
      >
        <mat-icon>add</mat-icon>
      </button>
    </div>

    <!-- Prix Total pour l'article -->
    <div class="text-right">
      <p class="font-bold text-base sm:text-lg text-gray-900 whitespace-nowrap tabular-nums">
        {{ (item().price * item().quantity) | currency }}
      </p>
    </div>

    <!-- Bouton de Suppression Globale -->
    <button
      mat-stroked-button
      color="warn"
      type="button"
      class="flex items-center gap-1.5 px-2.5 sm:px-3 py-1 text-red-600! border-0! sm:border! transition-colors shrink-0"
      (click)="removeCartItem()"
      aria-label="Remove item"
    >
      <mat-icon class="text-lg">delete</mat-icon>
      <span class="hidden md:inline font-medium">Delete</span>
    </button>
  </div>

</div>
