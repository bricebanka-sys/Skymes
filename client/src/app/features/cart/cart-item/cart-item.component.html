<div class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm mb-4 flex flex-col md:flex-row items-center justify-between gap-6">
  
  <!-- Image et Lien Produit -->
  <div class="flex items-center gap-4 w-full md:w-auto">
    <a [routerLink]="['/shop', item().productId]" class="shrink-0">
      <img [src]="item().pictureUrl" [alt]="item().productName" class="h-20 w-20 object-cover rounded-md" />
    </a>
    <div class="flex flex-col">
      <a [routerLink]="['/shop', item().productId]" class="font-medium text-gray-800 hover:text-blue-600 transition-colors">
        {{ item().productName }}
      </a>
      <span class="text-sm text-gray-500">{{ item().brand }} / {{ item().type }}</span>
    </div>
  </div>

  <!-- Contrôles de Quantité et Suppression -->
  <div class="flex items-center justify-between w-full md:w-auto gap-6">
    <div class="flex items-center gap-2">
      <!-- Bouton Décrémenter -->
      <button mat-icon-button class="text-red-600! hover:bg-red-50" (click)="decrementQuantity()">
        <mat-icon>remove</mat-icon>
      </button>
      
      <!-- Quantité -->
      <span class="font-semibold text-lg px-2">{{ item().quantity }}</span>
      
      <!-- Bouton Incrémenter -->
      <button mat-icon-button class="text-green-600! hover:bg-green-50" (click)="incrementQuantity()">
        <mat-icon>add</mat-icon>
      </button>
    </div>

    <!-- Prix Total pour l'article -->
    <div class="text-right">
      <p class="font-bold text-lg text-gray-900">{{ (item().price * item().quantity) | currency }}</p>
    </div>

    <!-- Bouton de Suppression Globale -->
    <button mat-stroked-button color="warn" class="flex items-center gap-1.5 px-3 py-1 text-red-600! border-0! sm:border! transition-colors" (click)="removeCartItem()">
      <mat-icon class="text-lg">delete</mat-icon>
      <span class="hidden sm:inline font-medium">Delete</span>
    </button>
  </div>

</div>
