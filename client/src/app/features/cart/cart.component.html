<section class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8 py-4 sm:py-6">
  @if (!cartService.cart()?.items?.length) {
    <app-empty-state
      message="Your shopping cart is empty"
      icon="remove_shopping_cart"
      actionText="Go to shop"
      (action)="onAction()"
    />
  } @else {
    <div class="flex flex-col lg:flex-row w-full items-stretch lg:items-start gap-6 lg:gap-8">
      <!-- Liste des articles -->
      <div class="w-full lg:flex-1 min-w-0">
        @for (item of cartService.cart()?.items ?? []; track item.productId) {
          <app-cart-item [item]="item" />
        }
      </div>

      <!-- Résumé de commande + Code promo -->
      <div class="w-full lg:w-96 xl:w-104 shrink-0 min-w-0">
        <app-order-summary />
      </div>
    </div>
  }
</section>
