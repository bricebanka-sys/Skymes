
<app-header></app-header>


<div class="container mt-6">
  <h2 class="text-3xl font-bold underline">Product Catalog</h2>

  <ul>
    <!-- Boucle moderne @for (introduite dans les versions récentes d'Angular) -->
    @for (product of products; track product.id) {
      <li>{{ product.name }}</li>
    }
  </ul>
</div>
