<header class="shadow-md p-3 w-full bg-white sticky top-0 z-50">
  <div class="flex flex-col md:flex-row items-center justify-between max-w-screen-2xl mx-auto gap-4 md:gap-0">
    
    <!-- Ligne supérieure sur mobile / Logo seul sur desktop -->
    <div class="flex items-center justify-between w-full md:w-auto">
      <!-- Logo de l'application redirigeant vers l'accueil -->
      <a routerLink="/" class="cursor-pointer">
        <img src="/images/logo.png" alt="app Logo" class="max-h-12 md:max-h-16 object-contain" />
      </a>
      
      <!-- Optionnel : Un bouton menu burger pourrait être ajouté ici si l'application grandit, 
           mais pour l'instant les liens passent en mode compact sur petits écrans -->
    </div>

    <!-- Liens de navigation principaux (ajustement de la taille de police et des espaces selon l'écran) -->
    <nav class="flex space-x-4 md:space-x-6 my-1 md:my-2 uppercase text-sm md:text-xl font-medium text-gray-700">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="hover:text-primary transition-colors">Home</a>
      <a routerLink="/shop" routerLinkActive="active" class="hover:text-primary transition-colors">Shop</a>
      <a routerLink="/contact" routerLinkActive="active" class="hover:text-primary transition-colors">Contact</a>
    </nav>

    <!-- Zone utilisateur (Panier & Auth) -->
    <div class="flex items-center gap-2 md:gap-3">
      <!-- Icône du panier avec badge de quantité -->
      <a href="#" matBadge="5" matBadgeSize="large" class="custom-badge mt-1 mr-2 flex items-center justify-center">
        <mat-icon>shopping_cart</mat-icon>
      </a>

      <!-- Boutons d'authentification (taille compacte sur mobile, normale sur desktop) -->
      <button mat-stroked-button class="text-xs md:text-sm px-2 md:px-4">Login</button>
      <button mat-stroked-button class="text-xs md:text-sm px-2 md:px-4">Register</button>
    </div>
    
  </div>
</header>
