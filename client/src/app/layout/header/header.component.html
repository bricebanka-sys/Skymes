<header class="shadow-md w-full bg-white fixed top-0 z-50">
  <!-- Ligne principale : Logo (gauche) et Actions utilisateur / Panier (droite) -->
  <div class="max-w-screen-2xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    
    <!-- Logo -->
    <div class="flex items-center">
      <a routerLink="/" class="cursor-pointer">
        <img src="/images/logo.png" alt="app Logo" class="max-h-12 md:max-h-20 object-contain" />
      </a>
    </div>

    <!-- Navigation Desktop (Cachée sur mobile, affichée au centre sur desktop) -->
    <nav class="hidden md:flex items-center space-x-6 uppercase text-sm md:text-lg font-medium text-gray-700">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="hover:text-primary transition-colors">Home</a>
      <a routerLink="/shop" routerLinkActive="active" class="hover:text-primary transition-colors">Shop</a>
      <a routerLink="/test-error" routerLinkActive="active" class="hover:text-primary transition-colors">Errors</a>
    </nav>

    <!-- Zone utilisateur (Panier & Auth alignés proprement à droite) -->
    <div class="flex items-center gap-2 md:gap-3">
      <!-- Icône du panier avec badge -->
      <a routerLink="/cart" routerLinkActive="active" matBadge="{{ cartService.itemCount() }}" matBadgeSize="large" (click)="onCartClick()" class="custom-badge mr-1 flex items-center justify-center">
        <mat-icon>shopping_cart</mat-icon>
      </a>

      <!-- Boutons d'authentification -->
      <!-- Navigation et Actions utilisateur -->     
        <!-- Boutons d'authentification -->
        <!-- Navigation et Actions utilisateur -->
        <div class="flex items-center gap-2 sm:gap-4">
          @if (accountService.currentUser(); as user) {
            <div class="mx-1 sm:mx-3">
              <button mat-button [matMenuTriggerFor]="menu" class="flex items-center gap-1 max-w-50 sm:max-w-xs truncate font-medium text-blue-700!">
                <mat-icon>arrow_drop_down</mat-icon>
                <span class="truncate">{{ user.email }}</span>
              </button>

              <mat-menu #menu="matMenu" class="user-menu">
                <button mat-menu-item routerLink="/cart">
                  <span class="flex items-center gap-3">
                    <mat-icon class="m-0! size-5! text-[20px]! leading-5! text-gray-700!">shopping_cart</mat-icon>
                    <span class="text-sm font-semibold leading-5 text-gray-900">My cart</span>
                  </span>
                </button>
                <button mat-menu-item routerLink="/orders">
                  <span class="flex items-center gap-3">
                    <mat-icon class="m-0! size-5! text-[20px]! leading-5! text-gray-700!">history</mat-icon>
                    <span class="text-sm font-semibold leading-5 text-gray-900">View orders</span>
                  </span>
                </button>
                <mat-divider />
                <button mat-menu-item (click)="logout()">
                  <span class="flex items-center gap-3">
                    <mat-icon class="m-0! size-5! text-[20px]! leading-5! text-gray-700!">logout</mat-icon>
                    <span class="text-sm font-semibold leading-5 text-gray-900">Logout</span>
                  </span>
                </button>
              </mat-menu>
            </div>
          } @else {
            <button mat-button routerLink="/account/login">Login</button>
            <button mat-flat-button routerLink="/account/register">Register</button>
          }
        </div>    
        
    </div>  

  </div>

  <!-- Barre de navigation Mobile (Visible uniquement sur petits écrans, centrée et élégante) -->
  <nav class="md:hidden flex items-center justify-center space-x-6 uppercase text-xs font-semibold text-gray-700 py-2 border-t border-gray-100 bg-gray-50/60">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="hover:text-primary transition-colors">Home</a>
    <a routerLink="/shop" routerLinkActive="active" class="hover:text-primary transition-colors">Shop</a>
    <a routerLink="/test-error" routerLinkActive="active" class="hover:text-primary transition-colors">Errors</a>
  </nav>

  <!-- Barre de progression ancrée précisément sur la bordure inférieure du Header -->
  @if (busyService.loading()) {
    <mat-progress-bar mode="indeterminate" class="absolute bottom-0 left-0 w-full"></mat-progress-bar>
  }
</header>
